# Merge selected entries into CODEX_HOME/config.toml; replace paths and URL.
# Stdio servers are child processes of native Codex, not Host Python providers.
[mcp_servers.local_tools]
command = "/absolute/path/to/mcp-server"
args = ["--stdio"]
# Explicitly pass required secrets through codex.inherit_env in agent.json.
env_vars = ["EXAMPLE_SERVICE_TOKEN"]

# Streamable HTTP server; credentials stay out of the committed config.
[mcp_servers.remote_tools]
url = "https://example.invalid/mcp"
bearer_token_env_var = "EXAMPLE_SERVICE_TOKEN"
