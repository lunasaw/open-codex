<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; color: #183b35; background: #f6f8f4; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    main { max-width: 760px; margin: auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .eyebrow { font-size: 11px; letter-spacing: .18em; font-weight: 700; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #2a8c70; margin-right: 6px; }
    .edition { font-size: 12px; color: #60756c; }
    .canvas { margin: 20px 0; overflow: hidden; border: 1px solid #d6e1d6; border-radius: 18px; background: #eaf1e5; }
    svg { display: block; width: 100%; height: auto; }
    #greeting { font-weight: 750; letter-spacing: -2px; fill: #183b35; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
    label { display: grid; gap: 7px; flex: 1; min-width: 150px; font-size: 12px; font-weight: 600; }
    input, button { font: inherit; font-size: 14px; border-radius: 10px; min-height: 44px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #cbd7cb; background: #fff; color: #183b35; }
    button { border: 0; padding: 11px 20px; background: #183b35; color: #fff; cursor: pointer; }
    button:hover { background: #2a594e; }
    button:disabled { opacity: .55; cursor: wait; }
    :focus-visible { outline: 3px solid #63ad93; outline-offset: 3px; }
    #status { margin: 14px 0 0; min-height: 18px; font-size: 12px; color: #60756c; }
    @media (max-width: 420px) { body { padding: 16px; } .edition { display: none; } }
    :root[data-theme="dark"] { background: #14231f; color: #e5eee5; }
    :root[data-theme="dark"] .edition, :root[data-theme="dark"] #status { color: #abc2b2; }
    :root[data-theme="dark"] input { background: #213930; color: #e5eee5; border-color: #496556; }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="eyebrow"><span class="dot"></span>A LITTLE HELLO</span>
      <span class="edition">Small beginnings. Endless possibilities.</span>
    </header>
    <div class="canvas">
      <svg viewBox="0 0 720 360" role="img" aria-labelledby="art-title art-description">
        <title id="art-title">Hello, World!</title>
        <desc id="art-description">绿色网格画布上的问候语，配有一颗微笑的太阳和轨道线。</desc>
        <defs>
          <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#cedcc9" stroke-width=".65"/>
          </pattern>
        </defs>
        <rect width="720" height="360" fill="url(#grid)"/>
        <ellipse cx="360" cy="156" rx="160" ry="60" fill="none" stroke="#9bb89b" transform="rotate(-18 360 156)"/>
        <circle cx="360" cy="135" r="55" fill="#f4c95e"/>
        <circle cx="345" cy="130" r="4" fill="#183b35"/>
        <circle cx="375" cy="130" r="4" fill="#183b35"/>
        <path d="M344 149 Q360 164 376 149" fill="none" stroke="#183b35" stroke-width="3" stroke-linecap="round"/>
        <circle cx="211" cy="194" r="8" fill="#4b8870"/>
        <path d="M500 70v18m-9-9h18M179 108v12m-6-6h12" stroke="#4b8870" stroke-width="2"/>
        <text id="greeting" x="360" y="270" text-anchor="middle" font-size="58">Hello, World!</text>
        <text x="360" y="311" text-anchor="middle" fill="#60756c" font-size="13" letter-spacing="3">SAY HELLO TO SOMETHING NEW</text>
      </svg>
    </div>
    <div class="controls">
      <label for="name">向谁问好？<input id="name" name="name" value="World" maxlength="40" autocomplete="off"></label>
      <button id="draw" type="button">重新绘制 ↗</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在连接…</p>
  </main>
  <!-- APP_SCRIPT -->
</body>
</html>
