[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-agent-host"
version = "0.1.0"
description = "Generic native Codex host with configurable skills, tools, MCP and a chat console"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.25,<5", "uvicorn>=0.35,<0.41"]

[project.optional-dependencies]
test = ["httpx>=0.28,<0.29"]

[project.scripts]
codex-agent = "codex_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"codex_agent" = ["protocol/*.json"]
"codex_agent.console" = ["static/*.html", "static/*.js", "static/*.css", "static/*.txt", "static/assets/*.js", "static/assets/*.css", "static/math-fonts/*.woff2"]
