<!doctype html><html><body>
<p id="status">starting</p><input id="draft" aria-label="App draft">
<button id="read">Read tool</button><button id="change">Change tool</button>
<button id="context">Update context</button><button id="message">Send message</button>
<button id="fullscreen">Fullscreen</button><button id="pip">Pip</button><button id="inline">Inline</button>
<button id="download">Download</button><button id="close">Close</button><p id="reply"></p>
<script>
const send = value => parent.postMessage({jsonrpc:'2.0', ...value}, '*');
let sequence = 1;
const pending = new Map();
window.notifications = [];
window.rpc = (method, params = {}) => new Promise((resolve, reject) => {
  const id = ++sequence; pending.set(id, {resolve, reject}); send({id, method, params});
});
addEventListener('message', event => {
  if(event.source !== parent) return;
  const m = event.data;
  if(m.id === 1 && m.result) { window.initialization = m.result; window.context = m.result.hostContext; send({method:'ui/notifications/initialized',params:{}}); }
  if(m.method) window.notifications.push(m);
  if(m.method === 'ui/notifications/tool-result') document.querySelector('#status').textContent = m.params.content[0].text;
  if(m.method === 'ui/notifications/host-context-changed') window.context = {...window.context, ...m.params};
  if(m.method === 'ui/resource-teardown') { send({id:m.id,result:{}}); return; }
  if(pending.has(m.id)) {
    const promise = pending.get(m.id); pending.delete(m.id);
    if(m.error) promise.reject(new Error(m.error.message)); else promise.resolve(m.result);
  }
});
const button = (id, method, params) => document.querySelector('#' + id).onclick = async () => {
  try { const result = await rpc(method, params); document.querySelector('#reply').textContent = result?.content?.[0]?.text || JSON.stringify(result); }
  catch(error) { document.querySelector('#reply').textContent = error.message; }
};
send({id:1,method:'ui/initialize',params:{appInfo:{name:'fixture',version:'1'},appCapabilities:{},protocolVersion:'2026-01-26'}});
button('read','tools/call',{name:'lookup',arguments:{q:'hello'}});
button('change','tools/call',{name:'change',arguments:{value:'edited'}});
button('context','ui/update-model-context',{content:[{type:'text',text:'Selected run'}],structuredContent:{runId:'run-42'}});
button('message','ui/message',{role:'user',content:[{type:'text',text:'Continue from the selected run'}]});
for(const mode of ['fullscreen', 'pip', 'inline']) button(mode, 'ui/request-display-mode', {mode});
button('download','ui/download-file',{contents:[{type:'resource',resource:{uri:'file:///report.txt',mimeType:'text/plain',text:'app export'}}]});
document.querySelector('#close').onclick = () => send({method:'ui/notifications/request-teardown',params:{}});
</script></body></html>
