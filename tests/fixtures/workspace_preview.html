<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>内嵌 HTML</title>
<style>body{background:rgb(240,245,250);font:16px sans-serif;padding:24px}button{padding:12px}</style>
</head><body><h1>交互讲解页面</h1><button id="counter">点击 0</button>
<p id="isolation"></p><p id="network"></p>
<script type="module">
let count = 0;
document.querySelector('#counter').onclick = event => { event.target.textContent = `点击 ${++count}`; };
try { parent.document.body.dataset.previewEscaped = 'true'; }
catch { document.querySelector('#isolation').textContent = '父页面已隔离'; }
try { await fetch('/api/sessions', { method: 'POST' }); }
catch { document.querySelector('#network').textContent = '网络请求已隔离'; }
</script></body></html>
